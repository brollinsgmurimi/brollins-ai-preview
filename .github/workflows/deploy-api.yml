name: Deploy Bro-llins AI API (manual)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Discover D1 database and configure binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID GitHub Actions secret."
            exit 1
          fi
          auth_response=$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          if [ "$(printf '%s' "$auth_response" | jq -r '.success // false')" != "true" ]; then
            echo "Cloudflare rejected the API token. Create a fresh token, verify it, and update the CLOUDFLARE_API_TOKEN GitHub secret. Do not paste the token into chat or commit it."
            printf '%s' "$auth_response" | jq -c '{errors: [.errors[]? | {code, message}], messages: [.messages[]? | {code, message}]}'
            exit 1
          fi
          response=$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -w '\\nHTTP_STATUS:%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          http_status=$(printf '%s' "$response" | sed -n 's/^HTTP_STATUS://p')
          response_body=$(printf '%s' "$response" | sed '/^HTTP_STATUS:/d')
          if [ "$http_status" != "200" ] || [ "$(printf '%s' "$response_body" | jq -r '.success // false')" != "true" ]; then
            echo "Cloudflare token verification passed, but D1 database access failed. Check that CLOUDFLARE_ACCOUNT_ID is the account containing the database and that the token has Account D1 Read permission."
            printf '%s' "$response_body" | jq -c '{errors: [.errors[]? | {code, message}], messages: [.messages[]? | {code, message}]}'
            exit 1
          fi
          D1_DATABASE_ID=$(printf '%s' "$response_body" | jq -r '.result[]? | select(.name == "bro-llins-ai") | .uuid' | head -n 1)
          if [ -z "$D1_DATABASE_ID" ] || [ "$D1_DATABASE_ID" = "null" ]; then
            echo "Could not find the D1 database named bro-llins-ai. Confirm it exists and the Cloudflare token has Account D1 Read and D1 Edit permissions."
            exit 1
          fi
          echo "D1_DATABASE_ID=$D1_DATABASE_ID" >> "$GITHUB_ENV"
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply bro-llins-ai --remote
      - name: Set owner bootstrap secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOTSTRAP_SECRET: ${{ secrets.BOOTSTRAP_SECRET }}
        run: |
          if [ -z "$BOOTSTRAP_SECRET" ]; then
            echo "Missing BOOTSTRAP_SECRET GitHub Actions secret."
            exit 1
          fi
          printf '%s' "$BOOTSTRAP_SECRET" | npx wrangler secret put BOOTSTRAP_SECRET
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
